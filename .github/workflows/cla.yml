# SPDX-License-Identifier: MIT
---
name: CLA Assistant

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

jobs:
  cla:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check signature
        run: |
          author="${{ github.event.pull_request.user.login }}"

          if jq -e --arg author "$author" 'has($author)' signatures/cla.json >/dev/null; then
            echo "CLA signed for @$author."
            exit 0
          fi

          echo "::error::CLA signature is missing for @$author."
          exit 1
